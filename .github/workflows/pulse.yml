name: Autonomous Activity Pulse

on:
  schedule:
    # 6 Fluid Checkpoints across UTC (covers Morning, Early Afternoon, Late Afternoon, Evening, Night, Midnight in IST)
    - cron: '30 4 * * *'   # ~10:00 IST (Morning)
    - cron: '30 7 * * *'   # ~13:00 IST (Early Afternoon)
    - cron: '30 10 * * *'  # ~16:00 IST (Late Afternoon)
    - cron: '30 12 * * *'  # ~18:00 IST (Evening / 17:30 - 18:30 IST)
    - cron: '00 16 * * *'  # ~21:30 IST (Night)
    - cron: '30 18 * * *'  # ~00:00 IST (Midnight)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  developer_session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATUS_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Developer Coding Session
        env:
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python session_runner.py
