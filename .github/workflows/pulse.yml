name: Autonomous Activity Pulse

on:
  schedule:
    # Window 1: Evening session start (13:30 UTC = 19:00 IST)
    - cron: '30 13 * * *'
    # Window 2: Late night wrap-up (16:30 UTC = 22:00 IST)
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATUS_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Human Behavior Random Timing Jitter
        run: |
          python delay_jitter.py

      - name: Record Heartbeat Pulse
        run: |
          python update_status.py

      - name: Commit and Push Activity
        run: |
          git config --global user.name "Pranjal Das"
          git config --global user.email "dpranjal366@gmail.com"
          git add -A
          COMMIT_MSG=$(cat .commit_msg 2>/dev/null || echo "chore(pulse): health checkpoint [skip ci]")
          git diff --staged --quiet || git commit -m "$COMMIT_MSG"
          git push origin main
